<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="deckGradient" x1="32" y1="32" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7CF4FF" />
      <stop offset="50%" stop-color="#5F6BFF" />
      <stop offset="100%" stop-color="#933CFF" />
    </linearGradient>
    <linearGradient id="keyGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect x="24" y="24" width="208" height="208" rx="40" fill="url(#deckGradient)" filter="url(#softShadow)" />
  <rect x="42" y="42" width="172" height="172" rx="28" fill="#05050C" opacity="0.75" />
  <g transform="translate(58 58)">
    <g fill="url(#keyGradient)">
      <!-- Top row (left and right stay subtle/white-gradient) -->
      <rect x="0" y="0" width="38" height="38" rx="10" />
      <rect x="96" y="0" width="38" height="38" rx="10" />
      <!-- Middle row (left and right subtle) -->
      <rect x="0" y="48" width="38" height="38" rx="10" />
      <rect x="96" y="48" width="38" height="38" rx="10" />
      <!-- Bottom row (all subtle base layer) -->
      <rect x="0" y="96" width="38" height="38" rx="10" />
      <rect x="48" y="96" width="38" height="38" rx="10" />
      <rect x="96" y="96" width="38" height="38" rx="10" />
    </g>

    <!-- Glow/active keys: center + top-middle + all three bottom -->
    <rect x="48" y="48" width="38" height="38" rx="10" fill="url(#deckGradient)" opacity="0.95" />           <!-- center -->
    <rect x="48" y="0"  width="38" height="38" rx="10" fill="url(#deckGradient)" opacity="0.95" />           <!-- top middle -->
    <rect x="0"  y="96" width="38" height="38" rx="10" fill="url(#deckGradient)" opacity="0.95" />           <!-- bottom left -->
    <rect x="48" y="96" width="38" height="38" rx="10" fill="url(#deckGradient)" opacity="0.95" />           <!-- bottom center -->
    <rect x="96" y="96" width="38" height="38" rx="10" fill="url(#deckGradient)" opacity="0.95" />           <!-- bottom right -->
  </g>
</svg>
