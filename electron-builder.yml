appId: com.bigdeck.app
productName: BigDeck
copyright: Copyright © 2024 BigDeck
artifactName: ${name}_${version}_${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - node_modules/**/*
  - assets/**/*
  - package.json

extraResources:
  - from: udev
    to: udev
  - from: systemd
    to: systemd
  # Bundled Elgato icon packs (the two com.elgato.defaulticons* libraries).
  # Seeded into <userData>/iconpacks at startup when the user has no packs —
  # packaged builds read <resources>/iconpacks here, dev runs read the repo
  # resources/iconpacks dir directly (src/main/index.ts iconPackSeedDir).
  - from: resources/iconpacks
    to: iconpacks
  # Bundled example SD plugin (product content). Seeded into
  # <userData>/sdplugins at startup when absent (ExamplePluginSeed.ts) —
  # packaged builds read <resources>/example-plugin here, dev runs read the
  # repo resources/example-plugin dir directly.
  - from: resources/example-plugin
    to: example-plugin

linux:
  target:
    - target: deb
      arch:
        - x64
        - arm64
    - target: AppImage
      arch:
        - x64
        - arm64
  icon: build/icons
  category: Utility
  maintainer: BigDeck Team
  vendor: BigDeck
  synopsis: Streamdeck controller for Linux
  description: BigDeck is a Linux application for controlling Elgato Streamdeck devices with profile management, key mapping, macros, network control, and plugin support.
  # executableName defaults to productName ("BigDeck"), and Electron derives
  # the X11 WM_CLASS and the Wayland app_id from it. The .desktop entry MUST
  # therefore pair with it: StartupWMClass=BigDeck (X11 matching) and the
  # entry name bigdeck.desktop (Wayland matches app_id to the file id).
  # build/bigdeck.desktop is kept in sync; see also src/main/index.ts
  # (BrowserWindow icon + app.setAppUserModelId).
  desktop:
    Name: BigDeck
    Comment: Streamdeck Controller for Linux
    Terminal: false
    Categories: Utility;System;
    StartupWMClass: BigDeck

deb:
  priority: optional
  compression: xz
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
  recommends:
    - xdotool
    - ydotool

appImage:
  artifactName: ${name}_${version}_${arch}.AppImage
  license: LICENSE

publish:
  provider: github
  owner: bigdeck
  repo: bigdeck
  releaseType: release
