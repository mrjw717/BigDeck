appId: com.bigdeck.app
productName: BigDeck
copyright: Copyright © 2024 BigDeck
artifactName: ${name}_${version}_${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - node_modules/**/*
  - assets/**/*
  - package.json

extraResources:
  - from: udev
    to: udev
  - from: systemd
    to: systemd

linux:
  target:
    - target: deb
      arch:
        - x64
        - arm64
    - target: AppImage
      arch:
        - x64
        - arm64
  icon: build/icons
  category: Utility
  maintainer: BigDeck Team
  vendor: BigDeck
  synopsis: Streamdeck controller for Linux
  description: BigDeck is a Linux application for controlling Elgato Streamdeck devices with profile management, key mapping, macros, network control, and plugin support.
  desktop:
    Name: BigDeck
    Comment: Streamdeck Controller for Linux
    Terminal: false
    Categories: Utility;System;

deb:
  priority: optional
  compression: xz
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
  recommends:
    - xdotool
    - ydotool

appImage:
  artifactName: ${name}_${version}_${arch}.AppImage
  license: LICENSE

publish:
  provider: github
  owner: bigdeck
  repo: bigdeck
  releaseType: release
